<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>身份验证器 商店素材</title>
    <!--
      商店截图的排版稿。

      这里刻意按**成品的一半**来排版（截图 640×400、宣传图 220×140）：浏览器截图是
      2 倍密度，所以最终 PNG 正好是商店要的 1280×800 与 440×280，不需要任何缩放。
      原始弹窗截图在 scripts/shots/raw/，也是 2 倍密度，缩到一半显示依然是视网膜清晰度。
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #080d18; }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #fff;
      }

      .shot {
        position: relative;
        width: 640px;
        height: 400px;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 74% 46%, rgba(47, 107, 255, 0.22) 0%, rgba(47, 107, 255, 0) 62%),
          linear-gradient(158deg, #0a1120 0%, #101a30 58%, #0a1120 100%);
      }

      /* 背景里极细的网格：给"工具"的质感，又不会抢内容 */
      .shot::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(88% 82% at 50% 50%, #000 30%, transparent 78%);
      }

      .brand {
        position: absolute;
        left: 32px;
        top: 28px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .brand img { width: 18px; height: 18px; border-radius: 5px; }
      .brand span {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #dbe4f5;
      }

      .copy {
        position: absolute;
        left: 32px;
        top: 50%;
        transform: translateY(-42%);
        width: 232px;
      }
      .eyebrow {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6f8ec9;
      }
      .copy h1 {
        margin-top: 9px;
        font-size: 21px;
        line-height: 1.32;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #fff;
      }
      .copy p {
        margin-top: 9px;
        font-size: 10.5px;
        line-height: 1.7;
        color: #93a4c2;
      }
      .copy ul {
        margin-top: 12px;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .copy li {
        position: relative;
        padding-left: 11px;
        font-size: 10px;
        line-height: 1.55;
        color: #b7c5de;
      }
      .copy li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 5.5px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #4d8bff;
      }

      /* 弹窗：裁掉右侧那 100px 的空白，只留 400px 的真实宽度 */
      .frame {
        position: absolute;
        left: 372px;
        /* 与下面 img 的宽度保持一致：原图就是 400 宽的弹窗，靠 width 缩到 62.5%。
           两者不等宽时 overflow 会把弹窗右边切掉一条（倒计时环首当其冲） */
        width: 250px;
        overflow: hidden;
        border-radius: 7px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.1),
          0 18px 44px -12px rgba(0, 0, 0, 0.75),
          0 4px 12px rgba(0, 0, 0, 0.35);
      }
      .frame img { display: block; width: 250px; }

      /* 宣传小图 440×280：这里按 220×140 排，2 倍密度出图。
         商店只认 440×280 这一档，比例 1.571 —— 别拿 920×680 顶替 */
      .promo {
        position: relative;
        width: 220px;
        height: 140px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        background:
          radial-gradient(90% 80% at 50% 34%, rgba(47, 107, 255, 0.3) 0%, rgba(47, 107, 255, 0) 66%),
          linear-gradient(160deg, #0a1120 0%, #101a30 60%, #080d18 100%);
      }
      .promo .mark { width: 30px; height: 30px; border-radius: 8px; box-shadow: 0 6px 14px -4px rgba(0, 0, 0, 0.8); }
      .promo h1 { margin-top: 7px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
      .promo p { margin-top: 3px; font-size: 7px; color: #93a4c2; letter-spacing: 0.01em; }
      .promo .chips { display: flex; gap: 3px; margin-top: 7px; }
      .promo .chips span {
        font-size: 5.5px;
        line-height: 1;
        color: #c7d4ea;
        padding: 2px 4px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: rgba(255, 255, 255, 0.04);
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      /**
       * 两种语言的排版稿共用一套骨架，只有文案和弹窗原图不同。
       *
       * `height` 是弹窗在稿子里的可见高度（稿子 640×400，弹窗按 62.5% 缩放，
       * 所以 400px 弹窗 → 250px 宽）。每种语言各一个值：同样的界面在英文下
       * 换行位置不同，卡片底边会上下挪，硬套中文的值会切出半行。
       */
      const SHOTS = {
        '1': {
          file: '1-list',
          height: { zh: 311, en: 311 },
          zh: {
            eyebrow: 'Account list',
            title: '一屏看完所有验证码',
            body: '点一下就复制，环形倒计时告诉你还剩几秒。搜索、置顶、拖拽排序都在列表上。',
            bullets: ['正常 / 紧凑 两档视图', '密钥从不出现在列表里', '顶部一键切明暗主题'],
          },
          en: {
            eyebrow: 'Account list',
            title: 'Every code, one screen',
            body: 'Click to copy, and the ring shows how long is left. Search, pin and drag to reorder, all in the list itself.',
            bullets: [
              'Normal and compact densities',
              'Secrets never show in the list',
              'Light and dark from the top bar',
            ],
          },
        },
        '2': {
          file: '2-dark',
          height: { zh: 311, en: 311 },
          zh: {
            eyebrow: 'Dark mode',
            title: '暗色不是简单反色',
            body: '背景、卡片、分隔线与强调色各自取过值，黑底上验证码依然一眼可读。',
            bullets: ['跟随系统，切了立刻生效', '不用重开弹窗', '颜色全部来自 CSS 变量'],
          },
          en: {
            eyebrow: 'Dark mode',
            title: 'Dark is not inverted',
            body: 'Background, cards, dividers and accent colours are each tuned, so codes stay legible on black.',
            bullets: [
              'Follows the system, instantly',
              'No need to reopen the popup',
              'Every colour is a CSS variable',
            ],
          },
        },
        '3': {
          file: '3-scan',
          height: { zh: 237, en: 237 },
          zh: {
            eyebrow: 'Add by screenshot',
            // 左栏只有 232px 宽，21px 字号一行最多九个汉字；
            // 多一个字就会把最后的"来"甩到第二行，看起来像排版出错
            title: '贴张截图就能加进来',
            body: '也可以直接粘贴 otpauth 地址或手动输入。识别结果先进表单，确认了才保存。',
            bullets: ['图片在本地解码，不申请摄像头', '不联网、不上传图片', '识别失败会说清是哪一步'],
          },
          en: {
            eyebrow: 'Add by screenshot',
            title: 'Drop in a screenshot',
            body: 'Pasting an otpauth link or typing it in works too. A scan always lands in a form first, so nothing is saved until you confirm.',
            bullets: [
              'Decoded locally, no camera access',
              'No network, the image never leaves',
              'Failures say which step went wrong',
            ],
          },
        },
        '4': {
          file: '4-backup',
          // 英文的备份卡片比中文高一屏文字：456（中文）会切在说明句中间，
          // 315 → 504px 弹窗高，正好落在卡片下沿之外、下一个分组标题之上
          height: { zh: 285, en: 315 },
          zh: {
            eyebrow: 'Local & encrypted',
            title: '密钥只加密存在本地',
            body: '不同步、不上传，也没有服务器能看到你的密钥。密码可以不设，设了就有恢复码兜底。',
            bullets: [
              'AES-256-GCM，密钥始终密文落盘',
              '忘记密码可用恢复码找回',
              '每天自动留一份加密备份',
            ],
          },
          en: {
            eyebrow: 'Local & encrypted',
            title: 'Secrets stay encrypted',
            body: 'No sync, no upload, and no server that could read your keys. The password is optional, and a recovery code has your back.',
            bullets: [
              'AES-256-GCM, always stored encrypted',
              'Recovery code if the password is lost',
              'One encrypted snapshot a day',
            ],
          },
        },
      };

      const PROMO = {
        zh: { name: '身份验证器', tagline: '两步验证器 · 本地生成，不联网', chips: ['无账号', '无内购', '可选加密'] },
        en: { name: 'Authenticator', tagline: 'Two-factor codes, generated on device', chips: ['No account', 'No IAP', 'Optional encryption'] },
      };

      const BRAND = { zh: '身份验证器', en: 'Authenticator' };

      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') === 'en' ? 'en' : 'zh';
      const stage = document.getElementById('stage');
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      // 英文套的弹窗原图在 raw/en/ 下，中文套保持在 raw/ 根上（历史产物沿用）
      const rawDir = lang === 'zh' ? '' : 'en/';

      if (params.get('board') === 'promo') {
        const promo = PROMO[lang];
        stage.innerHTML = `
          <div class="promo">
            <img class="mark" src="/icons/128.png" alt="" />
            <h1>${promo.name}</h1>
            <p>${promo.tagline}</p>
            <div class="chips">
              ${promo.chips.map((c) => `<span>${c}</span>`).join('')}
            </div>
          </div>`;
      } else {
        const shot = SHOTS[params.get('shot') ?? '1'];
        const copy = shot[lang];
        const cardHeight = shot.height[lang];
        stage.innerHTML = `
          <div class="shot">
            <div class="brand">
              <img src="/icons/128.png" alt="" />
              <span>${BRAND[lang]}</span>
            </div>
            <div class="copy">
              <div class="eyebrow">${copy.eyebrow}</div>
              <h1>${copy.title}</h1>
              <p>${copy.body}</p>
              <ul>${copy.bullets.map((b) => `<li>${b}</li>`).join('')}</ul>
            </div>
            <div class="frame" style="height:${cardHeight}px;top:${(400 - cardHeight) / 2}px">
              <img src="/scripts/shots/raw/${rawDir}${shot.file}.png" alt="" />
            </div>
          </div>`;
      }
    </script>
  </body>
</html>
